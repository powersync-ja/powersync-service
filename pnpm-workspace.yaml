packages:
  - 'packages/*'
  - 'libs/*'
  - 'modules/*'
  - 'service'
  - 'test-client'
  # exclude packages that are inside test directories
  - '!**/test/**'

catalog:
  zod: ^4.6.7
  vitest: ^4.1.11
  '@vitest/ui': ^4.1.11
  '@vitest/coverage-v8': ^4.1.11
  typescript: ~6.0.3
  uuid: ^14.0.0
  '@types/uuid': ^11.0.0

allowBuilds:
  # These need install scripts to download/build native modules
  '@mongodb-js/zstd': true
  esbuild: false

overrides:
  # Convex pins ws; keep its CLI on the patched version used by this workspace.
  'convex>ws': '^8.22.0'
  # Override to remove vitest production dependency
  # Remove once this is released: https://github.com/journeyapps-labs/common/pull/15
  '@journeyapps-labs/common-sdk@1.0.x>@journeyapps-labs/micro-streaming': '^1.0.2'
  # Override to resolve GHSA-xcx6-jx8p-x3h5
  '@azure/identity>@azure/msal-node': '7.1.2'
  # Override to resolve minor security issues
  'fast-uri@3.1.8': '3.1.9'
