[package]
name = "powersync_service_js_addon_shared"
description = "Node.js addon bindings for the PowerSync Service, shared by its editions."
edition = "2024"

version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
bumpalo = "3"
bson = { workspace = true }
powersync_service = { workspace = true }
log = { workspace = true }
napi = { workspace = true, features = ["serde-json"] }
napi-derive = { workspace = true }
serde_json = { version = "1" }
serde = { version = "1" }
smallvec = "1"
sha2 = "0.11"
