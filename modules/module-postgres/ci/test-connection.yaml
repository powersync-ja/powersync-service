# Used by the PostgreSQL connection CLI check in .github/workflows/test.yml.
replication:
  connections:
    - type: postgresql
      uri: postgres://postgres:postgres@localhost:5432/powersync_test
      sslmode: disable

storage:
  type: mongodb
  uri: mongodb://localhost:27017/powersync_test_connection

telemetry:
  disable_telemetry_sharing: true
