name: Start MongoDB
description: Start MongoDB with a replica set for tests

inputs:
  mongodb-version:
    description: MongoDB version to start
    required: false
    default: '8.0'
  mongodb-port:
    description: The port MongoDB should run on
    required: false
    default: 27017
  mongodb-container-name:
    description: The Docker container name to use (defaults to mongodb-<port>)
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Previously we used supercharge/mongodb-github-action@1.12.1.
    # However, we specifically want `--setParameter enableTestCommands=1`, which that doesn't support.
    # This now just starts MongoDB directly using Docker, and waits until it is ready.
    - name: Start MongoDB
      shell: bash
      run: |
        set -euo pipefail

        port="${{ inputs.mongodb-port }}"
        container_name="${{ inputs.mongodb-container-name }}"
        container_name="${container_name:-mongodb-${port}}"
        image="mongo:${{ inputs.mongodb-version }}"

        docker rm -f "$container_name" >/dev/null 2>&1 || true

        docker run \
          --name "$container_name" \
          --publish "$port:$port" \
          --detach \
          "$image" \
          mongod \
          --port "$port" \
          --replSet test-rs \
          --bind_ip_all \
          --setParameter enableTestCommands=1

        for i in $(seq 1 30); do
          if docker exec "$container_name" mongosh --quiet --port "$port" --eval "db.adminCommand({ ping: 1 })" >/dev/null; then
            break
          fi
          sleep 1
          if [ "$i" -eq 30 ]; then
            echo "MongoDB did not become ready in time"
            docker logs "$container_name"
            exit 1
          fi
        done

        docker exec "$container_name" mongosh --quiet --port "$port" --eval \
          "rs.initiate({_id:'test-rs', members:[{_id:0, host:'localhost:$port'}]})"

        for i in $(seq 1 30); do
          if docker exec "$container_name" mongosh --quiet --port "$port" --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null; then
            break
          fi
          sleep 1
          if [ "$i" -eq 30 ]; then
            echo "MongoDB replica set did not become primary in time"
            docker logs "$container_name"
            exit 1
          fi
        done
