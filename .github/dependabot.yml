version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns:
          - '*'

  - package-ecosystem: 'rust-toolchain'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
